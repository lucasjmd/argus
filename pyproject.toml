[project]
name = "argus"
version = "0.1.0"
description = "Transaction validation engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "loguru>=0.7",
    "mysql-connector-python>=9.6.0",
    "pandas>=3.0.3",
    "psutil>=7.2.2",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.48.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.2",
]

[tool.ruff]
line-length = 80

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint]
extend-select = [
    "I",
    "UP",
    "PLR5501",
    "PLR1711",
    "PLR1714",
    "PLR0402",
    "SIM",
    "N",
    "C4",
    "F",
    "E",
    "W391",
    "W505",
    "RET",
    "TID252",
    "PTH",
    "TD004",
    "TD005",
    "TD006",
    "TD007",

]


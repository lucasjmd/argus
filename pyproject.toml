[project]
name = "argus"
version = "0.1.0"
description = "Transaction validation engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7",
    "psutil>=7.2.2",
    "pydantic>=2.12.5",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.2",
]

[tool.ruff]


services:
  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - argus-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$MYSQL_ROOT_PASSWORD" ]
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build: .
    container_name: argus-app
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    networks:
      - argus-network

volumes:
  mysql_data:
    external: true


networks:
  argus-network:
    name: argus-network

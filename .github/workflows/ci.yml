name: CI Pipeline

on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  linter-and-tester:
    name: Runs linters and Pytest
    runs-on: ubuntu-latest
    env:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: argus

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup python312
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync

      - name: Run ruff
        run: uv run ruff check .

      - name: Start docker dompose
        run: docker compose up -d --wait

      - name: Run pytest
        run: docker compose exec -T api uv run pytest

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: argus-service:latest